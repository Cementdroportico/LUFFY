name: Temp sync README TODO

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-readme-todos:
    runs-on: ubuntu-latest
    steps:
      - name: Check out dev with history
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Ensure origin/main is available
        run: git fetch --no-tags origin main:refs/remotes/origin/main

      - name: Update Complete TODO List
        id: update
        run: |
          cat > /tmp/sync_todos.py <<'PY'
          import os,re,subprocess,tokenize,json,difflib
          from pathlib import Path
          os.chdir(os.environ.get('GITHUB_WORKSPACE','.'))
          def g(*a):
           p=subprocess.run(['git',*a],text=True,capture_output=True,check=True)
           return p.stdout
          def ext(rel):
           try:
            with open(rel,'rb') as f: toks=list(tokenize.tokenize(f.readline))
            cs=[(t.start[0],t.string) for t in toks if t.type==tokenize.COMMENT]
           except Exception:
            with open(rel,encoding='utf-8',errors='replace') as f:
             cs=[(i+1,l) for i,l in enumerate(f) if 'TODO' in l]
           rx=re.compile(r'^#\s*TODO(?:\s*\(([^)]*)\))?\s*:?\s*(.*?)\s*$',re.I)
           out=[]
           for n,c in cs:
            m=rx.match(c)
            if m: out.append((n,m.group(2).strip()))
           return sorted(out)
          changed=set()
          for rec in g('diff','--name-status','-M','origin/main...HEAD','--').splitlines():
           p=rec.split('\t')
           paths=p[1:] if p[0][0] in 'RC' else p[1:2]
           changed.update(x.replace('\\','/') for x in paths if x.endswith('.py'))
          allpy=sorted(x.replace('\\','/') for x in g('ls-files').splitlines() if x.endswith('.py'))
          allt={x:ext(x) for x in allpy}
          rp=Path('README.md'); raw=rp.read_bytes(); eol='\r\n' if b'\r\n' in raw[:8192] else '\n'
          text=raw.decode('utf-8'); lines=text.splitlines(True)
          title='### 📝 Complete TODO List'
          ti=next(i for i,l in enumerate(lines) if l.startswith(title))
          mhead=re.match(r'^(#{1,6})(?:\s|$)',lines[ti]); assert mhead and len(mhead.group(1))==3
          end=len(lines)
          for i in range(ti+1,len(lines)):
           m=re.match(r'^(#{1,6})(?:\s|$)',lines[i].rstrip('\r\n'))
           if m and len(m.group(1))<=3:
            end=i; break
          irx=re.compile(r'^- \[ \] \*\*(.+?):(\d+)\*\* -[ \t]?(.*?)\r?$')
          inds=[]; groups={}; old={}
          for i in range(ti+1,end):
           m=irx.match(lines[i].rstrip('\r\n'))
           if not m: continue
           inds.append(i); pa,n,tx=m.groups(); n=int(n)
           groups.setdefault(pa,[]).append((n,lines[i]))
           old.setdefault(pa,[]).append((n,tx.strip()))
          assert inds, 'No existing TODO items found'
          assert all(irx.match(lines[i].rstrip('\r\n')) for i in range(inds[0],inds[-1]+1)), 'Non-item line inside TODO block'
          for pa in changed: groups.pop(pa,None)
          for pa in sorted(changed):
           if pa in allt and Path(pa).is_file():
            groups[pa]=[(n,f'- [ ] **{pa}:{n}** - {tx}{eol}') for n,tx in allt[pa]]
          out=[]; parsed={}
          for pa in sorted(groups):
           for n,l in sorted(groups[pa],key=lambda z:z[0]):
            out.append(l)
            m=irx.match(l.rstrip('\r\n')); assert m
            parsed.setdefault(pa,[]).append((int(m.group(2)),m.group(3).strip()))
          flat=[(pa,n) for pa in sorted(parsed) for n,_ in parsed[pa]]
          assert flat==sorted(flat,key=lambda x:(x[0],x[1])), 'TODO list not sorted'
          new=''.join(lines[:inds[0]]+out+lines[inds[-1]+1:])
          assert title in new
          rp.write_bytes(new.encode('utf-8'))
          warn=[]
          for pa in sorted(set(old)|set(allt)):
           if pa not in changed and old.get(pa,[]) != allt.get(pa,[]): warn.append(pa)
          report={'changed_python_paths':sorted(changed),'tracked_python_files':len(allpy),'scanned_todo_comments':sum(map(len,allt.values())),'old_readme_items':sum(map(len,old.values())),'new_readme_items':len(out),'readme_changed':text!=new,'scope_warnings':warn,'changed_path_entries':{p:allt.get(p,[]) for p in sorted(changed)},'diff':''.join(difflib.unified_diff(text.splitlines(True),new.splitlines(True),fromfile='a/README.md',tofile='b/README.md',n=3))}
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY
          python /tmp/sync_todos.py | tee /tmp/todo-sync-report.json

      - name: Commit updated README to dev
        run: |
          set -euo pipefail
          if git diff --quiet -- README.md; then
            echo "README.md is already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: sync Complete TODO List for dev [skip ci]"
          git push origin HEAD:dev

      - name: Show synchronization report
        if: always()
        run: |
          if [ -f /tmp/todo-sync-report.json ]; then
            python - <<'PY'
          import json
          p='/tmp/todo-sync-report.json'
          data=json.load(open(p))
          print(json.dumps({k:v for k,v in data.items() if k != 'diff'}, ensure_ascii=False, indent=2))
          print('--- DIFF ---')
          print(data.get('diff',''))
          PY
          else
            echo "No synchronization report was generated."
          fi
