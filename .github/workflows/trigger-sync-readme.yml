name: Trigger README TODO sync

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/trigger-sync-readme.yml'
      - '.github/workflows/temp-sync-readme-todos.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out dev with full history
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Ensure origin/main ref
        run: git fetch --no-tags origin main:refs/remotes/origin/main

      - name: Extract embedded synchronization script
        run: |
          python - <<'EXTRACT'
          from pathlib import Path
          import textwrap
          p = Path('.github/workflows/temp-sync-readme-todos.yml')
          lines = p.read_text(encoding='utf-8').splitlines()
          start = next(i for i, line in enumerate(lines) if "cat > /tmp/sync_todos.py <<'PY'" in line)
          end = next(i for i in range(start + 1, len(lines)) if lines[i].strip() == 'PY')
          script = textwrap.dedent('\n'.join(lines[start + 1:end])) + '\n'
          Path('/tmp/sync_todos.py').write_text(script, encoding='utf-8')
          print(f'Extracted {end - start - 1} script lines')
          EXTRACT
          python -m py_compile /tmp/sync_todos.py

      - name: Update README TODO section
        id: update
        run: python /tmp/sync_todos.py | tee /tmp/todo-sync-report.json

      - name: Commit README changes
        run: |
          set -euo pipefail
          if git diff --quiet -- README.md; then
            echo "README.md is already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: sync Complete TODO List for dev [skip ci]"
          git push origin HEAD:dev

      - name: Print synchronization report
        if: always()
        run: |
          if [ -f /tmp/todo-sync-report.json ]; then
            python - <<'REPORT'
          import json
          with open('/tmp/todo-sync-report.json', encoding='utf-8') as f:
              data = json.load(f)
          print(json.dumps({k: v for k, v in data.items() if k != 'diff'}, ensure_ascii=False, indent=2))
          print('--- README DIFF ---')
          print(data.get('diff', ''))
          REPORT
          else
            echo 'No report file was generated.'
          fi
