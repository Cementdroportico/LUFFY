name: Temporary TODO author repair

on:
  workflow_dispatch:
  push:
    branches:
      - dev
    paths:
      - .github/workflows/temp-fix-todo-author-tags.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name Repair moved TODO author text
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          import subprocess

          readme = Path("README.md")
          bulk_sync_commit = "eef4d85e5f1be49c27af9c1f4985809ecbc20969"

          # The cleanup commits after the bulk documentation sync must only remove
          # workflow files, so README.md at HEAD must initially match that commit.
          subprocess.run(
              ["git", "diff", "--quiet", bulk_sync_commit, "HEAD", "--", "README.md"],
              check=True,
          )

          raw_text = readme.read_bytes().decode("utf-8")
          lines = raw_text.splitlines(keepends=True)
          title = "### 📝 Complete TODO List"
          title_matches = [i for i, line in enumerate(lines) if line.startswith(title)]
          assert len(title_matches) == 1, title_matches
          title_idx = title_matches[0]
          title_heading = re.match(r"^(#{1,6})(?:\s|$)", lines[title_idx].rstrip("\r\n"))
          assert title_heading is not None and len(title_heading.group(1)) == 3

          section_end = len(lines)
          for i in range(title_idx + 1, len(lines)):
              heading = re.match(r"^(#{1,6})(?:\s|$)", lines[i].rstrip("\r\n"))
              if heading and len(heading.group(1)) <= 3:
                  section_end = i
                  break

          item_re = re.compile(
              r"^- \[ \] \*\*(?P<path>.+?):(?P<line>\d+)\*\* -[ \t]?(?P<text>.*?)\r?$"
          )
          author_fixes = {
              ("luffy/verl/verl/protocol.py", 169):
                  "(zhangchi.usc1992) add consistency check",
              ("luffy/verl/verl/protocol.py", 351):
                  "(zhangchi.usc1992) whether to copy",
          }
          expected_entries = {
              "luffy/deepscaler/utils.py": [
                  (45, "Add logging for API calls and errors"),
                  (46, "Support batch processing for multiple prompts"),
                  (47, "Add timeout configuration for API calls"),
                  (107, "Implement Vertex AI initialization and authentication"),
                  (108, "Configure safety settings for content generation"),
                  (109, "Set up GenerativeModel with proper system instructions"),
                  (110, "Implement retry logic with exponential backoff"),
                  (111, "Add comprehensive error handling for API access issues"),
                  (112, "Handle rate limiting and quota management"),
                  (113, "Implement response validation and text extraction"),
                  (114, "Add support for different generation configurations"),
              ],
              "luffy/verl/verl/protocol.py": [
                  (114, "Optimize memory usage during tensor reshaping"),
                  (115, "Add support for different tensor types and shapes"),
                  (136, "Optimize tensor view operations for performance"),
                  (137, "Add error handling for invalid batch dimensions"),
                  (169, "(zhangchi.usc1992) add consistency check"),
                  (265, "we can actually lift this restriction if needed"),
                  (351, "(zhangchi.usc1992) whether to copy"),
              ],
          }

          keys = []
          entries = {}
          replacements = []

          for i in range(title_idx + 1, section_end):
              raw_line = lines[i]
              match = item_re.match(raw_line.rstrip("\r\n"))
              if match is None:
                  continue

              path = match.group("path")
              line_number = int(match.group("line"))
              text = match.group("text")
              key = (path, line_number)
              keys.append(key)
              entries[key] = text

              if key in author_fixes:
                  wanted_text = author_fixes[key]
                  bare_text = wanted_text.replace("(zhangchi.usc1992) ", "", 1)
                  eol = "\r\n" if raw_line.endswith("\r\n") else (
                      "\n" if raw_line.endswith("\n") else ""
                  )
                  fixed_line = (
                      f"- [ ] **{path}:{line_number}** - {wanted_text}{eol}"
                  )

                  if raw_line == fixed_line:
                      print(f"Already correct: {path}:{line_number}")
                  else:
                      assert text == bare_text, (key, text, bare_text)
                      print(f"Repairing {path}:{line_number}: {text!r} -> {wanted_text!r}")
                      lines[i] = fixed_line
                      replacements.append(key)

                  entries[key] = wanted_text

          assert len(keys) == 215, f"Expected 215 TODO items, found {len(keys)}"
          assert keys == sorted(keys, key=lambda item: (item[0], item[1])), \
              "TODO entries are not sorted by path then line number"

          for path, expected in expected_entries.items():
              actual = [(line, entries[(path, line)]) for line, _ in expected]
              assert actual == expected, (path, actual, expected)

          new_text = "".join(lines)
          assert title in new_text
          if replacements:
              assert len(replacements) == 2, replacements
              readme.write_bytes(new_text.encode("utf-8"))
              print(f"Applied {len(replacements)} author-tag repair(s).")
          else:
              assert new_text == raw_text
              print("No README change required; both author tags are present.")
          PY
          git diff --check -- README.md

      - name Commit and push repair
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- README.md; then
            echo "README already contains the required TODO author tags."
            exit 0
          fi

          added="$(git diff --numstat -- README.md | awk '{print $1}')"
          deleted="$(git diff --numstat -- README.md | awk '{print $2}')"
          test "$added" = "2"
          test "$deleted" = "2"
          echo "--- TODO author repair diff ---"
          git diff -- README.md

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: preserve TODO authors in README [skip ci]"
          git push origin HEAD:dev
          echo "Pushed repair commit $(git rev-parse HEAD)"
